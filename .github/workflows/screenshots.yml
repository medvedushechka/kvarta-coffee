name: Capture website screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/screenshots.yml"
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          npm run dev > /tmp/kvarta-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/kvarta-next.log
          exit 1
      - name: Capture actual browser screenshots
        run: node scripts/capture-screenshots.cjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual website screenshots"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Could not push screenshots after retries" >&2
            exit 1
          fi
