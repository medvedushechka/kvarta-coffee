name: Install chosen Pexels coffee video
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/coffee-video.yml"
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download selected Pexels video
        run: |
          python -m pip install --quiet yt-dlp
          yt-dlp --no-playlist --format 'best[height<=1080][ext=mp4]/best[ext=mp4]/best' --output '/tmp/kvarta-pexels.%(ext)s' 'https://www.pexels.com/video/a-close-up-of-coffee-beans-20534642/'
          ffmpeg -y -i "$(find /tmp -maxdepth 1 -name 'kvarta-pexels.*' | head -1)" -t 16 -vf "scale='min(1280,iw)':-2" -an -c:v libx264 -preset medium -crf 27 -movflags +faststart public/coffee-cinema.mp4
          file public/coffee-cinema.mp4
          test "$(stat -c%s public/coffee-cinema.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/coffee-cinema.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coffee-cinema.mp4
          git diff --cached --quiet && exit 0
          git commit -m "assets: use warm Pexels coffee beans clip"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
